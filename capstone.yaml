name: flyrank-capstone-widget-platform
run: docker compose up --build
seed: docker compose exec app python -m app.seed
test: docker compose exec app pytest -q
base_url: http://localhost:8000
probes:
  - GET  /health/live
  - GET  /health/ready
  - POST /auth/register
  - POST /auth/login
  - POST /widgets                      # authenticated
  - GET  /widgets/{id}/config           # public, cached
  - POST /submissions                   # public, CORS, rate-limited
  - GET  /dashboard/stats               # authenticated
